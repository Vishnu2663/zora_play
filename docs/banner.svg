    <path d="M168 156 Q 198 140 194 106" stroke="#C9601A" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M168 152 Q 196 136 192 106" stroke="url(#body3d)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="102" r="13" fill="#FFE9C7"/><circle cx="192" cy="102" r="13" fill="#FFE9C7"/>
    <!-- head -->
    <path d="M42 30 L 52 -6 L 78 18 Z" fill="#FFD9A0"/><path d="M158 30 L 148 -6 L 122 18 Z" fill="#FFD9A0"/>
    <circle cx="70" cy="2" r="12" fill="url(#teal3d)"/><circle cx="92" cy="-4" r="13" fill="url(#teal3d)"/><circle cx="114" cy="2" r="12" fill="url(#teal3d)"/>
    <ellipse cx="100" cy="66" rx="74" ry="64" fill="url(#body3d)"/>
    <ellipse cx="78" cy="38" rx="30" ry="16" fill="#fff" opacity=".28" transform="rotate(-18 78 38)"/>
    <ellipse cx="68" cy="66" rx="19" ry="22" fill="#fff"/><ellipse cx="132" cy="66" rx="19" ry="22" fill="#fff"/>
    <circle cx="71" cy="70" r="12" fill="url(#eye3d)"/><circle cx="129" cy="70" r="12" fill="url(#eye3d)"/><circle cx="76" cy="64" r="4.5" fill="#fff"/><circle cx="134" cy="64" r="4.5" fill="#fff"/>
    <ellipse cx="100" cy="98" rx="33" ry="22" fill="#FFB273"/><ellipse cx="100" cy="90" rx="20" ry="8" fill="#FFD3A8" opacity=".6"/>
    <circle cx="90" cy="92" r="3" fill="#B5541A"/><circle cx="110" cy="92" r="3" fill="#B5541A"/>
    <path d="M80 106 Q 100 126 120 106" stroke="#5B2410" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="44" cy="96" rx="12" ry="8" fill="#FF8FA3" opacity=".65"/><ellipse cx="156" cy="96" rx="12" ry="8" fill="#FF8FA3" opacity=".65"/>
  </g>
</svg>
