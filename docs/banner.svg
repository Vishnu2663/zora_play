    <path d="M30 120 Q -14 96 -4 50 Q 36 70 58 108 Z" fill="url(#teal3d)" opacity=".95"/><path d="M190 120 Q 234 96 224 50 Q 184 70 162 108 Z" fill="url(#teal3d)" opacity=".95"/>
    <!-- feet -->
    <ellipse cx="62" cy="236" rx="34" ry="16" fill="#C9601A"/><ellipse cx="62" cy="231" rx="32" ry="14" fill="url(#body3d)"/>
    <ellipse cx="138" cy="236" rx="34" ry="16" fill="#C9601A"/><ellipse cx="138" cy="231" rx="32" ry="14" fill="url(#body3d)"/>
    <!-- body -->
    <ellipse cx="100" cy="160" rx="80" ry="84" fill="url(#body3d)"/>
    <ellipse cx="100" cy="176" rx="48" ry="58" fill="url(#belly3d)"/>
    <path d="M66 156 Q 100 168 134 156 M 62 182 Q 100 196 138 182 M 70 208 Q 100 218 130 208" stroke="#E7C58F" stroke-width="4" fill="none" stroke-linecap="round"/>
